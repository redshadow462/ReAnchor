<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>ReAnchor — Secure Multi-Factor Identity Recovery</title>
</head>

<body>
    <a href="index.html">
    <img src="images/Reanchor.jpg" alt="ReAnchor">
    </a>
    <main>
        <section aria-labelledby="login">
            <h1 id="login">Login</h1>
            <form action="/login" method="post">
                <div>
                    <label for="login-email">Email</label>
                    <input id="login-email" name="email" type="email" autocomplete="email" required>
                </div>
                <div>
                    <label for="login-password">Password</label>
                    <input id="login-password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button type="submit">Log in</button>
            </form>
        </section>

        <section aria-labelledby="register-heading">
            <h2 id="register-heading">Register</h2>
            <form action="/register" method="post">
                <div>
                    <label for="register-username">Username</label>
                    <input id="register-username" name="username" type="text" autocomplete="username" required>
                </div>
                <div>
                    <label for="register-email">Email</label>
                    <input id="register-email" name="email" type="email" autocomplete="email" required>
                </div>
                <div>
                    <label for="register-password">Password</label>
                    <input id="register-password" name="password" type="password" autocomplete="new-password" required>
                </div>
                <div>
                    <label for="register-password-confirmation">Confirm password</label>
                    <input id="register-password-confirmation" name="password_confirmation" type="password" autocomplete="new-password" required>
                </div>
                <button type="submit">Register</button>
            </form>
        </section>
    </main>

</body>
</html>
